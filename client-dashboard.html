var LIV_ST = ['livre','facture_deposee','dossier_cloture'];
var STATUT_LABELS = {
  'nouveau':'Nouveau','diagnostic':'Diagnostic','chiffrage':'Chiffrage en cours',
  'attente_validation':'Attente validation','attente_pieces':'Attente pieces',
  // 23/11/2026 : tous les statuts de l'atelier, en mots clairs pour le client
  'reception':'Vehicule recu','attente_diag':'En attente de diagnostic','diag_en_cours':'Diagnostic en cours',

  'devis_termine':'Devis pret','devis_envoye':'Devis envoye — en attente de votre accord','accord_client':'Accord recu','modifier_devis':'Devis en cours de modification',

  'travaux_attente':'En attente des travaux','travaux_cours':'Travaux en cours','reprise_demandee':'Travaux en cours',
  'travaux_termines':'Controle qualite','en_test':'Controle qualite','attente_valid_chef':'Controle qualite',
  'vehicule_termine':'Vehicule termine','en_lavage':'Lavage','client_contacte':'Pret — vous avez ete contacte','attente_client':'Pret — en attente de recuperation',
  'en_cours_livraison':'En cours de livraison','facture_emettre':'Facturation en cours','facture_emise':'Facture emise',
  'livre':'Livre','facture_deposee':'Facture deposee','dossier_cloture':'Dossier cloture'
};

function labelStatut(s){ return STATUT_LABELS[s] || (s||'—'); }
// Compte le nombre de jours OUVRABLES (lundi a vendredi, samedi/dimanche
// exclus) entre deux timestamps — utilise pour le delai d'immobilisation,
// afin de ne pas compter les week-ends comme du temps d'atelier "perdu".
// Jours feries non geres pour l'instant (liste non maintenue de facon
// fiable), uniquement le week-end est exclu.
function joursOuvrablesEntre(debut, fin){
  if(!debut || !fin || fin<debut) return 0;
  var dDebut = new Date(debut); dDebut.setHours(0,0,0,0);
  var dFin = new Date(fin); dFin.setHours(0,0,0,0);
  var count = 0;
  var cursor = new Date(dDebut);
  while(cursor.getTime() <= dFin.getTime()){
    var jourSemaine = cursor.getDay();
    if(jourSemaine!==0 && jourSemaine!==6) count++;
    cursor.setDate(cursor.getDate()+1);
  }
  return count;
}

// Determine le statut d'echeance d'un controle technique :
// - 'ce_mois' : echeance tombe dans le mois calendaire en cours
// - 'retard'  : echeance deja passee (avant le debut du mois en cours)
// - null      : pas concerne (echeance future, ou aucune date connue)
function statutEcheanceCt(dateEcheance){
  if(!dateEcheance) return null;
  var d = new Date(dateEcheance);
  if(isNaN(d.getTime())) return null;
  var maintenant = new Date();
  var debutMoisCourant = new Date(maintenant.getFullYear(), maintenant.getMonth(), 1);
  var finMoisCourant = new Date(maintenant.getFullYear(), maintenant.getMonth()+1, 0, 23,59,59,999);
  if(d>=debutMoisCourant && d<=finMoisCourant) return 'ce_mois';
  if(d<debutMoisCourant) return 'retard';
  return null;
}

// Verifie si une date d'echeance tombe dans le mois calendaire EN COURS
// OU est deja en retard.
function estEcheanceCeMois(dateEcheance){
  var statut = statutEcheanceCt(dateEcheance);
  return statut==='ce_mois' || statut==='retard';
}

function formaterDelai(jours){
  if(jours===null || jours===undefined) return null;
  return jours.toFixed(2)+'j';
}
function estEnCours(v){ return LIV_ST.indexOf(v.status)<0; }

auth.onAuthStateChanged(function(user){
  if(!user){
    window.location.href = 'client.html';
    return;
  }
  currentUid = user.uid;
  chargerProfilEtDonnees(user.uid);
});

function chargerProfilEtDonnees(uid){
  db.ref('gos_client_accounts/'+uid).once('value').then(function(snap){
    if(!snap.exists()){
      afficherErreurGenerale('Profil client introuvable. Contactez le garage.');
      return;
    }
    compteClient = snap.val();
    document.getElementById('topClientName').textContent = compteClient.clientNom;
    document.getElementById('topClientSub').textContent = compteClient.departement
      ? 'Departement : '+compteClient.departement
      : 'Vue globale';
    chargerVehicules();
  }).catch(function(){
    afficherErreurGenerale('Erreur de connexion au serveur.');
  });
}

function chargerVehicules(){
  db.ref('gos_portail/'+auth.currentUser.uid+'/vehicules').once('value') /* C-09 : projection du client, plus jamais gos_data */.then(function(snap){
    var raw = snap.val();
    var tous = [];
    try{ tous = JSON.parse(raw)||[]; }catch(e){ tous = []; }

    mesVehicules = tous.filter(function(v){
      // 23/11/2026 : la liste est deja filtree par GarageOS pour CE compte ; on ne compare plus
      // le nom lettre par lettre ni le telephone (majuscules, espaces, numero change = page vide)
      if(String(v.client||'').trim().toLowerCase().replace(/\s+/g,' ') !== String(compteClient.clientNom||'').trim().toLowerCase().replace(/\s+/g,' ')) return false;
      if(compteClient.departement){
        return (v.departements||[]).indexOf(compteClient.departement) >= 0;
      }
      return true;
    });

    renderDashboard();
  }).catch(function(err){
    afficherErreurGenerale('Erreur de chargement des donnees.');
    console.error(err);
  });
}

function afficherErreurGenerale(msg){
  document.getElementById('mainContent').innerHTML = '<div class="empty">'+msg+'</div>';
}

// Regroupe tous les passages (objets vehicles distincts, meme immat) en un
// seul enregistrement "vehicule physique" avec l'historique complet. Chaque
// visite au garage cree un nouvel objet dans vehicles cote GarageOS — ce
// regroupement reconstitue le vrai historique par immatriculation, comme
// l'app Direction le fait deja ailleurs (comptage des interventions forfait).
function regrouperParImmatriculation(liste){
  var groupes = {};
  liste.forEach(function(v){
    var key = (v.immat||'sans-immat').toUpperCase();
    if(!groupes[key]) groupes[key] = [];
    groupes[key].push(v);
  });
  return Object.keys(groupes).map(function(key){
    var passages = groupes[key].sort(function(a,b){return (b.entree||0)-(a.entree||0);}); // plus recent d'abord

    // Kilometrage le plus recent connu (le champ km est saisi a chaque
    // passage ; on prend la valeur du passage le plus recent qui en a une).
    var dernierKm = null;
    for(var i=0;i<passages.length;i++){
      if(passages[i].km){ dernierKm = passages[i].km; break; }
    }
    var ctEcheance = null;
    for(var k=0;k<passages.length;k++){
      if(passages[k].ct_echeance){ ctEcheance = passages[k].ct_echeance; break; }
    }

    // Delai moyen d'immobilisation EN JOURS OUVRABLES : uniquement sur les
    // passages termines (entree ET livraison connues, livraison posterieure
    // a l'entree). Samedi/dimanche exclus du comptage.
    var delais = [];
    passages.forEach(function(p){
      if(p.entree && p.livraison && p.livraison>=p.entree){
        var jours = joursOuvrablesEntre(p.entree, p.livraison);
        if(jours>0 && jours<365) delais.push(jours);
      }
    });
    var delaiMoyenJours = delais.length ? (delais.reduce(function(s,d){return s+d;},0)/delais.length) : null;

    // Nombre de retours : passages explicitement marques "Retour client"
    // par le garage a l'accueil (champ v.nature), pas un calcul deduit —
    // c'est une vraie information saisie indiquant qu'un vehicule revient
    // suite a une panne deja traitee.
    var nbRetours = passages.filter(function(p){return p.nature==='Retour client';}).length;

    // Age du vehicule : base sur la date de mise en circulation (mec) si
    // connue, sinon sur l'annee (v.annee) en repli. On cherche la premiere
    // valeur non vide parmi tous les passages (l'info peut avoir ete
    // saisie a un passage different du plus recent).
    var ageAnnees = null;
    for(var j=0;j<passages.length;j++){
      var p = passages[j];
      if(p.mec){
        var dMec = new Date(p.mec);
        if(!isNaN(dMec.getTime())){
          ageAnnees = (Date.now()-dMec.getTime())/(365.25*86400000);
          break;
        }
      }
      if(p.annee && !isNaN(parseInt(p.annee,10))){
        ageAnnees = new Date().getFullYear() - parseInt(p.annee,10);
        break;
      }
    }

    return {
      immat: key==='sans-immat' ? '' : key,
      marque: passages[0].marque,
      modele: passages[0].modele,
      typeClient: passages[0].typeClient,
      passages: passages,
      dernierPassage: passages[0],
      ageAnnees: ageAnnees,
      nbVisites: passages.length,
      dernierKm: dernierKm,
      delaiMoyenJours: delaiMoyenJours,
      nbRetours: nbRetours,
      ctEcheance: ctEcheance
    };
  });
}

// Applique la recherche texte (marque ou immatriculation) et le filtre de
// periode sur la liste brute des passages, AVANT le regroupement par
// immatriculation — pour qu'un vehicule dont aucune visite ne correspond a
// la periode choisie disparaisse completement de l'affichage.
function appliquerFiltres(liste){
  var q = rechercheTexte.trim().toLowerCase();
  return liste.filter(function(v){
    if(q){
      var immat = (v.immat||'').toLowerCase();
      var marque = (v.marque||'').toLowerCase();
      var modele = (v.modele||'').toLowerCase();
      if(immat.indexOf(q)<0 && marque.indexOf(q)<0 && modele.indexOf(q)<0) return false;
    }
    if(periodeFiltre==='custom' && periodeDebut && periodeFin){
      var dEntree = v.entree || 0;
      if(dEntree < periodeDebut || dEntree > periodeFin) return false;
    }
    return true;
  });
}

function onChangeRecherche(){
  var input = document.getElementById('rechercheInput');
  rechercheTexte = input.value;
  var positionCurseur = input.selectionStart; // sauvegarde avant que le re-rendu ne detruise le champ
  renderDashboard();
  // Le renderDashboard() reconstruit tout le DOM via innerHTML, ce qui
  // recree un NOUVEL element <input> sans focus — on le redonne
  // explicitement, sinon l'utilisateur doit re-cliquer apres chaque
  // caractere tape.
  var nouveauInput = document.getElementById('rechercheInput');
  if(nouveauInput){
    nouveauInput.focus();
    nouveauInput.setSelectionRange(positionCurseur, positionCurseur);
  }
}

function appliquerPeriode(){
  var deb = document.getElementById('periodeDebutInput').value;
  var fin = document.getElementById('periodeFinInput').value;
  if(!deb || !fin){ alert('Selectionnez les deux dates.'); return; }
  periodeDebut = new Date(deb).setHours(0,0,0,0);
  periodeFin = new Date(fin).setHours(23,59,59,999);
  periodeFiltre = 'custom';
  renderDashboard();
}

function reinitialiserPeriode(){
  periodeFiltre = 'tout';
  periodeDebut = null;
  periodeFin = null;
  document.getElementById('periodeDebutInput').value = '';
  document.getElementById('periodeFinInput').value = '';
  renderDashboard();
}

function renderDashboard(){
  var vehiculesFiltres = appliquerFiltres(mesVehicules);
  var vehiculesUniques = regrouperParImmatriculation(vehiculesFiltres);
  var vehiculesDevis = vehiculesUniques.filter(function(g){return g.typeClient!=='forfait';});
  var vehiculesForfait = vehiculesUniques.filter(function(g){return g.typeClient==='forfait';});

  var html = '';

  if(!mesVehicules.length){
    document.getElementById('mainContent').innerHTML = '<div class="empty">Aucun vehicule associe a votre compte pour le moment.</div>';
    return;
  }

  // Barre de recherche + filtre de periode + impression groupee. Toujours
  // affichee (meme si la recherche ne donne aucun resultat), pour que le
  // client puisse modifier/reinitialiser son filtre.
  html += '<div class="search-bar">';
  html += '<input type="text" class="search-input" id="rechercheInput" placeholder="Rechercher par marque ou immatriculation..." value="'+rechercheTexte.replace(/"/g,'&quot;')+'" oninput="onChangeRecherche()">';
  html += '<span class="filter-label">Periode :</span>';
  html += '<input type="date" class="date-input" id="periodeDebutInput" value="'+(periodeDebut?new Date(periodeDebut).toISOString().slice(0,10):'')+'">';
  html += '<span class="filter-label">a</span>';
  html += '<input type="date" class="date-input" id="periodeFinInput" value="'+(periodeFin?new Date(periodeFin).toISOString().slice(0,10):'')+'">';
  html += '<button class="btn-filter'+(periodeFiltre==='custom'?' active':'')+'" onclick="appliquerPeriode()">Appliquer</button>';
  if(periodeFiltre==='custom'){
    html += '<button class="btn-filter" onclick="reinitialiserPeriode()">Reinitialiser</button>';
  }
  html += '<button class="btn-print-all" onclick="imprimerToutHistorique()">&#128424; Imprimer tout l\'historique</button>';
  html += '<button class="btn-print-all" style="background:#185FA5" onclick="exporterToutHistoriqueExcel()">&#128202; Exporter tout en Excel</button>';
  html += '</div>';

  if(!vehiculesUniques.length){
    html += '<div class="empty">Aucun vehicule ne correspond a votre recherche.</div>';
    document.getElementById('mainContent').innerHTML = html;
    return;
  }

  // KPI global (commun devis/forfait) : controle technique a echeance ce
  // mois OU deja en retard — affiche une seule fois, au-dessus des deux
  // blocs, puisqu'il concerne l'ensemble de la flotte du client.
  var vehiculesCtEcheance = vehiculesUniques.filter(function(g){return estEcheanceCeMois(g.ctEcheance);});
  var nbCtCeMois = vehiculesCtEcheance.filter(function(g){return statutEcheanceCt(g.ctEcheance)==='ce_mois';}).length;
  var nbCtRetard = vehiculesCtEcheance.filter(function(g){return statutEcheanceCt(g.ctEcheance)==='retard';}).length;
  html += '<div class="kgrid k2" style="margin-bottom:16px">';
  html += '<div class="kpi"><div class="kpi-lbl">Vehicules</div><div class="kpi-val">'+vehiculesUniques.length+'</div></div>';
  html += '<div class="kpi"'+(vehiculesCtEcheance.length>0?' style="cursor:pointer;border-color:#E8A44A;background:#FFF8E8" onclick="ouvrirListeCtEcheance()"':'')+'><div class="kpi-lbl">CT a echeance / en retard</div><div class="kpi-val"'+(vehiculesCtEcheance.length>0?' style="color:#854F0B"':'')+'>'+nbCtCeMois+' ce mois'+(nbCtRetard>0?' <span style="color:#A32D2D">&middot; '+nbCtRetard+' en retard</span>':'')+'</div></div>';
  html += '</div>';

  // 23/11/2026 : client 100 % devis -> presentation compacte en tableaux depliables
  if(vehiculesDevis.length && !vehiculesForfait.length){
    html += renderTableauxClientDevis(vehiculesFiltres);
    document.getElementById('mainContent').innerHTML = html;
    return;
  }

  if(vehiculesDevis.length){
    var coutTotalFlotte = 0;
    var facturesImpayees = 0;
    vehiculesFiltres.filter(function(v){return v.typeClient!=='forfait';}).forEach(function(v){
      if(v.chiffrage && v.chiffrage.lignes){
        var montantFacture = v.chiffrage.lignes.filter(function(cl){return (cl.piece||'').trim();})
          .reduce(function(s,cl){return s+(parseFloat(cl.prixVente)||0)*(parseInt(cl.qte)||1);},0);
        coutTotalFlotte += montantFacture;
        var paye = parseFloat(v.montantPaye)||0;
        if(montantFacture>paye) facturesImpayees += (montantFacture-paye);
      }
    });

    html += '<div class="kgrid k4">';
    html += kpiHtml('Vehicules actifs', vehiculesDevis.length);
    html += kpiHtml('Cout total flotte', coutTotalFlotte.toLocaleString('fr-FR')+' FCFA', '#185FA5');
    html += kpiHtml('Factures impayees', facturesImpayees.toLocaleString('fr-FR')+' FCFA', facturesImpayees>0?'#A32D2D':'#3B6D11');
    var delaisFlotteDevis = vehiculesDevis.filter(function(g){return g.delaiMoyenJours!==null;}).map(function(g){return g.delaiMoyenJours;});
    var delaiMoyenFlotteDevis = delaisFlotteDevis.length ? (delaisFlotteDevis.reduce(function(s,d){return s+d;},0)/delaisFlotteDevis.length) : null;
    html += kpiHtml('Immobilisation moyenne (flotte)', formaterDelai(delaiMoyenFlotteDevis)||'—');
    html += '</div>';

    html += '<div class="kgrid k3" style="margin-top:12px">';
    html += kpiHtml('Age moyen de la flotte', formaterAgeMoyen(vehiculesDevis));
    html += kpiHtml('Kilometrage moyen', formaterKmMoyen(vehiculesDevis));
    var totalRetoursDevis = vehiculesDevis.reduce(function(s,g){return s+(g.nbRetours||0);},0);
    html += kpiHtml('Nombre de retours', totalRetoursDevis, totalRetoursDevis>0?'#A32D2D':'#3B6D11');
    html += '</div>';

    html += '<div class="section-title">Vehicules en cours</div>';
    var enCoursDevis = vehiculesDevis.filter(function(g){return estEnCours(g.dernierPassage);});
    var autresDevis = vehiculesDevis.filter(function(g){return !estEnCours(g.dernierPassage);});
    if(enCoursDevis.length){
      enCoursDevis.forEach(function(g){ html += renderVehiculeCardDevis(g); });
    } else {
      html += '<div class="empty">Aucun vehicule en cours actuellement.</div>';
    }

    if(autresDevis.length){
      html += '<div class="section-title">Vos vehicules</div>';
      html += '<table><thead><tr><th>Vehicule</th><th>Statut</th><th style="text-align:center">Visites</th><th style="text-align:center">Retours</th><th style="text-align:right">Km</th><th style="text-align:right">Cout total</th><th></th></tr></thead><tbody>';
      autresDevis.forEach(function(g){
        var coutTotalImmat = 0;
        g.passages.forEach(function(p){
          if(p.chiffrage && p.chiffrage.lignes){
            coutTotalImmat += p.chiffrage.lignes.filter(function(cl){return (cl.piece||'').trim();})
              .reduce(function(s,cl){return s+(parseFloat(cl.prixVente)||0)*(parseInt(cl.qte)||1);},0);
          }
        });
        html += '<tr><td><strong>'+g.immat+'</strong> <span class="xs muted">'+(g.marque||'')+' '+(g.modele||'')+'</span></td>';
        html += '<td><span class="badge b-green">'+labelStatut(g.dernierPassage.status)+'</span></td>';
        html += '<td style="text-align:center">'+g.nbVisites+'</td>';
        html += '<td style="text-align:center">'+(g.nbRetours>0?'<span style="color:#A32D2D;font-weight:600">'+g.nbRetours+'</span>':'—')+'</td>';
        html += '<td style="text-align:right">'+(g.dernierKm?g.dernierKm.toLocaleString('fr-FR'):'—')+'</td>';
        html += '<td style="text-align:right;font-family:monospace">'+(coutTotalImmat?coutTotalImmat.toLocaleString('fr-FR')+' FCFA':'—')+'</td>';
        html += '<td><button class="btn-detail" onclick="ouvrirHistoriqueVehicule(\''+g.immat+'\')">Historique</button></td></tr>';
      });
      html += '</tbody></table>';
    }

    var facturesAAfficher = vehiculesFiltres.filter(function(v){
      return v.typeClient!=='forfait' && v.chiffrage && v.chiffrage.lignes && v.chiffrage.lignes.some(function(cl){return (cl.piece||'').trim();});
    });
    if(facturesAAfficher.length){
      html += '<div class="section-title">Vos factures</div>';
      html += '<table><thead><tr><th>Vehicule</th><th>Date</th><th style="text-align:right">Montant</th>'
           + '<th style="text-align:right">Deja verse</th><th style="text-align:right">Reste a payer</th>'
           + '<th>Statut</th><th></th></tr></thead><tbody>';
      facturesAAfficher.forEach(function(v){
        var montantFacture = v.chiffrage.lignes.filter(function(cl){return (cl.piece||'').trim();})
          .reduce(function(s,cl){return s+(parseFloat(cl.prixVente)||0)*(parseInt(cl.qte)||1);},0);
        var paye = parseFloat(v.montantPaye)||0;
        var dateFacture = v.chiffrage.valideDirLe || v.chiffrage.soumisLe || v.entree;
        var statutLabel = paye>=montantFacture ? 'Payee' : (paye>0 ? 'Partiel' : 'En attente');
        var statutClasse = paye>=montantFacture ? 'b-green' : (paye>0 ? 'b-amber' : 'b-red');
        html += '<tr><td>'+(v.immat||'—')+'</td><td>'+(dateFacture?new Date(dateFacture).toLocaleDateString('fr-FR'):'—')+'</td>';
        html += '<td style="text-align:right;font-family:monospace">'+montantFacture.toLocaleString('fr-FR')+'</td>';
        // Ce que le client a deja verse, et ce qu'il lui reste : le mot
        // « Partiel » seul ne lui disait ni l'un ni l'autre.
        var resteAPayer = Math.max(0, montantFacture - paye);
        html += '<td style="text-align:right;font-family:monospace;color:#3B6D11">'+(paye?Math.round(paye).toLocaleString('fr-FR'):'—')+'</td>';
        html += '<td style="text-align:right;font-family:monospace;font-weight:700;color:'+(resteAPayer>0?'#A32D2D':'#3B6D11')+'">'+(resteAPayer?Math.round(resteAPayer).toLocaleString('fr-FR'):'0')+'</td>';
        html += '<td><span class="badge '+statutClasse+'">'+statutLabel+'</span></td>';
        html += '<td><button class="btn-detail" onclick="imprimerFacture(\''+v.id+'\')">Imprimer</button></td></tr>';
      });
      html += '</tbody></table>';
    }
  }

  if(vehiculesForfait.length){
    html += '<div class="kgrid k3" style="margin-top:'+(vehiculesDevis.length?'24px':'0')+'">';
    html += kpiHtml('Vehicules en forfait', vehiculesForfait.length);
    var nbInterventionsForfait = vehiculesFiltres.filter(function(v){return v.typeClient==='forfait';}).reduce(function(s,v){
      return s + ((v.chiffrage&&v.chiffrage.lignes) ? v.chiffrage.lignes.filter(function(cl){return (cl.piece||'').trim();}).length : 0);
    },0);
    html += kpiHtml('Interventions', nbInterventionsForfait);
    var delaisFlotteForfait = vehiculesForfait.filter(function(g){return g.delaiMoyenJours!==null;}).map(function(g){return g.delaiMoyenJours;});
    var delaiMoyenFlotteForfait = delaisFlotteForfait.length ? (delaisFlotteForfait.reduce(function(s,d){return s+d;},0)/delaisFlotteForfait.length) : null;
    html += kpiHtml('Immobilisation moyenne (flotte)', formaterDelai(delaiMoyenFlotteForfait)||'—');
    html += '</div>';

    html += '<div class="kgrid k3" style="margin-top:12px">';
    html += kpiHtml('Age moyen de la flotte', formaterAgeMoyen(vehiculesForfait));
    html += kpiHtml('Kilometrage moyen', formaterKmMoyen(vehiculesForfait));
    var totalRetoursForfait = vehiculesForfait.reduce(function(s,g){return s+(g.nbRetours||0);},0);
    html += kpiHtml('Nombre de retours', totalRetoursForfait, totalRetoursForfait>0?'#A32D2D':'#3B6D11');
    html += '</div>';

    html += '<div class="section-title">Vehicules en cours (forfait)</div>';
    var enCoursForfait = vehiculesForfait.filter(function(g){return estEnCours(g.dernierPassage);});
    var autresForfait = vehiculesForfait.filter(function(g){return !estEnCours(g.dernierPassage);});
    if(enCoursForfait.length){
      enCoursForfait.forEach(function(g){ html += renderVehiculeCardForfait(g); });
    } else {
      html += '<div class="empty">Aucun vehicule en cours actuellement.</div>';
    }

    if(autresForfait.length){
      html += '<div class="section-title">Vos vehicules (forfait)</div>';
      html += '<table><thead><tr><th>Vehicule</th><th>Statut</th><th style="text-align:center">Visites</th><th style="text-align:center">Retours</th><th style="text-align:right">Km</th><th></th></tr></thead><tbody>';
      autresForfait.forEach(function(g){
        html += '<tr><td><strong>'+g.immat+'</strong> <span class="xs muted">'+(g.marque||'')+' '+(g.modele||'')+'</span></td>';
        html += '<td><span class="badge b-green">'+labelStatut(g.dernierPassage.status)+'</span></td>';
        html += '<td style="text-align:center">'+g.nbVisites+'</td>';
        html += '<td style="text-align:center">'+(g.nbRetours>0?'<span style="color:#A32D2D;font-weight:600">'+g.nbRetours+'</span>':'—')+'</td>';
        html += '<td style="text-align:right">'+(g.dernierKm?g.dernierKm.toLocaleString('fr-FR'):'—')+'</td>';
        html += '<td><button class="btn-detail" onclick="ouvrirHistoriqueVehicule(\''+g.immat+'\')">Historique</button></td></tr>';
      });
      html += '</tbody></table>';
    }
  }

  document.getElementById('mainContent').innerHTML = html;
  chargerCompteursMessagesNonLus();
}

function kpiHtml(label, val, color){
  return '<div class="kpi"><div class="kpi-lbl">'+label+'</div><div class="kpi-val"'+(color?' style="color:'+color+'"':'')+'>'+val+'</div></div>';
}

// Age moyen de la flotte : moyenne des ages connus (mec ou annee), en
// ignorant les vehicules sans aucune de ces deux informations.
function formaterAgeMoyen(groupes){
  var ages = groupes.filter(function(g){return g.ageAnnees!==null;}).map(function(g){return g.ageAnnees;});
  if(!ages.length) return '—';
  var moyenne = ages.reduce(function(s,a){return s+a;},0)/ages.length;
  return moyenne.toFixed(1)+' an'+(moyenne>=2?'s':'');
}

// Kilometrage moyen de la flotte : moyenne du dernier km connu de chaque
// vehicule, en ignorant ceux dont le km n'a jamais ete saisi.
function formaterKmMoyen(groupes){
  var kms = groupes.filter(function(g){return g.dernierKm;}).map(function(g){return g.dernierKm;});
  if(!kms.length) return '—';
  var moyenne = Math.round(kms.reduce(function(s,k){return s+k;},0)/kms.length);
  return moyenne.toLocaleString('fr-FR')+' km';
}

function renderVehiculeCardDevis(g){
  var v = g.dernierPassage;
  var enCours = estEnCours(v);
  var statutClasse = enCours ? 'b-blue' : 'b-green';
  var coutTotalImmat = 0;
  g.passages.forEach(function(p){
    if(p.chiffrage && p.chiffrage.lignes){
      coutTotalImmat += p.chiffrage.lignes.filter(function(cl){return (cl.piece||'').trim();})
        .reduce(function(s,cl){return s+(parseFloat(cl.prixVente)||0)*(parseInt(cl.qte)||1);},0);
    }
  });
  // Montant du devis EN COURS uniquement (le passage actuel, pas le cumul
  // historique deja affiche en bas de carte) — demande explicite pour les
  // vehicules en cours, afin que le client voie tout de suite l'ordre de
  // grandeur du devis avant meme d'ouvrir l'historique.
  var montantDevisEnCours = 0;
  if(enCours && v.chiffrage && v.chiffrage.lignes){
    montantDevisEnCours = totalDevisPassage(v);   // meme calcul que le devis du garage (remise, pieces mises de cote)
  }
  var html = '<div class="vcard">';
  html += '<div class="vcard-head"><div>';
  html += '<div class="vcard-immat">'+(g.immat||'—')+' — '+(g.marque||'')+' '+(g.modele||'')+'</div>';
  html += '<div class="vcard-modele"><span class="badge '+statutClasse+'">'+labelStatut(v.status)+'</span> <span class="xs muted">&middot; '+g.nbVisites+' visite'+(g.nbVisites>1?'s':'')+' a l\'atelier</span></div>';
  if(enCours && montantDevisEnCours>0){
    html += '<div class="xs" style="margin-top:4px;font-weight:600;color:#185FA5;display:flex;align-items:center;gap:8px;flex-wrap:wrap">Montant du '+(estFacturePassage(v)?'dossier':'devis')+' en cours : '+Math.round(montantDevisEnCours).toLocaleString('fr-FR')+' FCFA'
      + (v.doc ? ' <button class="btn-detail" style="font-size:12px;padding:3px 10px" onclick="voirDocument(\''+v.id+'\')">&#x1F4C4; Voir '+(estFacturePassage(v)?'la facture':'le devis')+'</button>' : '') + '</div>';
  }
  html += renderInfosVehicule(g);
  html += renderInfosEnCours(v);
  html += '</div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">';
  html += '<button class="btn-detail" onclick="ouvrirHistoriqueVehicule(\''+g.immat+'\')">Historique complet</button>';
  html += '<button class="btn-detail" onclick="ouvrirMessagerie(\''+v.id+'\',\''+g.immat+'\')" id="btn-msg-'+v.id+'">&#128172; Message</button>';
  html += '</div></div>';
  if(coutTotalImmat>0){
    html += '<div class="vcard-foot">Cout total (toutes visites) sur ce vehicule : <strong>'+coutTotalImmat.toLocaleString('fr-FR')+' FCFA</strong></div>';
  }
  html += '</div>';
  return html;
}

function renderInfosVehicule(g){
  var delaiFormate = formaterDelai(g.delaiMoyenJours);
  var parts = [];
  if(g.dernierKm) parts.push(g.dernierKm.toLocaleString('fr-FR')+' km');
  if(delaiFormate) parts.push('Immobilisation moyenne : '+delaiFormate);
  if(g.nbRetours>0) parts.push('<span style="color:#A32D2D;font-weight:600">'+g.nbRetours+' retour'+(g.nbRetours>1?'s':'')+'</span>');
  if(!parts.length) return '';
  return '<div class="xs muted" style="margin-top:3px">'+parts.join(' &middot; ')+'</div>';
}

// Pour un vehicule EN COURS uniquement : temps d'immobilisation deja
// ecoule depuis l'entree (pas la moyenne historique), et la date de
// livraison prevue (v.livraison sert de date previsionnelle tant que le
// vehicule n'est pas encore effectivement livre).
function renderInfosEnCours(v){
  if(!estEnCours(v)) return '';
  var parts = [];
  if(v.entree){
    var joursEcoules = joursOuvrablesEntre(v.entree, Date.now());
    parts.push('Immobilise depuis : <strong>'+formaterDelai(joursEcoules)+'</strong>');
  }
  if(v.livraison){
    var dPrevue = new Date(v.livraison);
    var enRetard = v.livraison < Date.now();
    parts.push('Livraison prevue : <strong'+(enRetard?' style="color:#A32D2D"':'')+'>'+dPrevue.toLocaleDateString('fr-FR')+(enRetard?' (en retard)':'')+'</strong>');
  }
  if(!parts.length) return '';
  return '<div class="xs" style="margin-top:5px;background:#FAEEDA;border-radius:6px;padding:6px 10px;color:#854F0B">'+parts.join(' &middot; ')+'</div>';
}

function renderVehiculeCardForfait(g){
  var v = g.dernierPassage;
  var enCours = estEnCours(v);
  var statutClasse = enCours ? 'b-blue' : 'b-green';
  var html = '<div class="vcard">';
  html += '<div class="vcard-head"><div>';
  html += '<div class="vcard-immat">'+(g.immat||'—')+' — '+(g.marque||'')+' '+(g.modele||'')+'</div>';
  html += '<div class="vcard-modele"><span class="badge '+statutClasse+'">'+labelStatut(v.status)+'</span> <span class="xs muted">&middot; '+g.nbVisites+' visite'+(g.nbVisites>1?'s':'')+' a l\'atelier</span></div>';
  html += renderInfosVehicule(g);
  html += renderInfosEnCours(v);
  html += '</div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">';
  html += '<button class="btn-detail" onclick="ouvrirHistoriqueVehicule(\''+g.immat+'\')">Historique complet</button>';
  html += '<button class="btn-detail" onclick="ouvrirMessagerie(\''+v.id+'\',\''+g.immat+'\')" id="btn-msg-'+v.id+'">&#128172; Message</button>';
  html += '</div></div>';
  if(v.chiffrage && v.chiffrage.lignes){
    var pieces = v.chiffrage.lignes.filter(function(cl){return (cl.piece||'').trim();});
    if(pieces.length){
      html += '<div class="pieces-list">';
      pieces.slice(0,6).forEach(function(cl){ html += '<span class="piece-chip">'+cl.piece+'</span>'; });
      if(pieces.length>6) html += '<span class="piece-chip">+'+(pieces.length-6)+' autre(s)</span>';
      html += '</div>';
      html += '<div class="no-price-note">Aucun montant affiche — couvert par votre forfait</div>';
    }
  }
  html += '</div>';
  return html;
}

// Affiche l'historique complet d'un vehicule (toutes les visites passees,
// meme immatriculation), avec pour chaque passage : dates d'entree/sortie,
// motif du client, et travaux/pieces effectues. C'est la vraie liste des
// evenements ; le prix n'apparait que pour un vehicule devis, jamais pour
// un forfait (coherent avec le reste du portail).
function ouvrirHistoriqueVehicule(immat){
  var g = regrouperParImmatriculation(mesVehicules).find(function(x){return x.immat===immat;});
  if(!g) return;
  var estForfait = g.typeClient==='forfait';

  var html = '<button class="detail-close" onclick="fermerDetail()">&#10005;</button>';
  html += '<h3>'+(g.immat||'—')+' — '+(g.marque||'')+' '+(g.modele||'')+'</h3>';

  var tauxRetour = g.nbVisites ? Math.round((g.nbRetours/g.nbVisites)*100) : 0;

  // Montant total depense sur ce vehicule, toutes visites confondues
  // (jamais affiche pour un forfait, coherent avec le reste du portail).
  var coutTotalVehicule = 0;
  if(!estForfait){
    g.passages.forEach(function(p){
      if(p.chiffrage && p.chiffrage.lignes){
        coutTotalVehicule += p.chiffrage.lignes.filter(function(cl){return (cl.piece||'').trim();})
          .reduce(function(s,cl){return s+(parseFloat(cl.prixVente)||0)*(parseInt(cl.qte)||1);},0);
      }
    });
  }

  html += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">';
  html += '<span class="badge b-gray">'+g.nbVisites+' visite'+(g.nbVisites>1?'s':'')+'</span>';
  if(g.dernierKm) html += '<span class="badge b-gray">'+g.dernierKm.toLocaleString('fr-FR')+' km</span>';
  if(g.delaiMoyenJours!==null) html += '<span class="badge b-gray">Immobilisation moyenne : '+formaterDelai(g.delaiMoyenJours)+'</span>';
  html += '<span class="badge '+(g.nbRetours>0?'b-red':'b-green')+'">Taux de retour : '+tauxRetour+'%'+(g.nbRetours>0?' ('+g.nbRetours+'/'+g.nbVisites+')':'')+'</span>';
  if(g.ctEcheance && estEcheanceCeMois(g.ctEcheance)){
    var statutCt = statutEcheanceCt(g.ctEcheance);
    html += '<span class="badge '+(statutCt==='retard'?'b-red':'b-amber')+'">CT '+(statutCt==='retard'?'en retard depuis':'a echeance :')+' '+new Date(g.ctEcheance).toLocaleDateString('fr-FR')+'</span>';
  }
  if(!estForfait && coutTotalVehicule>0){
    html += '<span class="badge b-blue" style="font-weight:700">Total depense : '+coutTotalVehicule.toLocaleString('fr-FR')+' FCFA</span>';
  }
  html += '</div>';

  g.passages.forEach(function(p, idx){
    var dateEntree = p.entree ? new Date(p.entree).toLocaleDateString('fr-FR') : '—';
    var dateSortie = (p.livraison && LIV_ST.indexOf(p.status)>=0) ? new Date(p.livraison).toLocaleDateString('fr-FR') : null;
    var lignes = (p.chiffrage && p.chiffrage.lignes) ? p.chiffrage.lignes.filter(function(cl){return (cl.piece||'').trim();}) : [];
    var montantPassage = estForfait ? 0 : lignes.reduce(function(s,cl){return s+(parseFloat(cl.prixVente)||0)*(parseInt(cl.qte)||1);},0);

    html += '<div style="border:1px solid #e8e6e1;border-radius:9px;padding:12px 14px;margin-bottom:10px">';
    html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">';
    html += '<div><strong>Visite du '+dateEntree+'</strong>'+(dateSortie?' <span class="xs muted">au '+dateSortie+'</span>':' <span class="badge b-blue" style="margin-left:4px">En cours</span>')+'</div>';
    if(!estForfait && montantPassage>0){
      html += '<div style="font-family:monospace;font-weight:700">'+montantPassage.toLocaleString('fr-FR')+' FCFA</div>';
    }
    html += '</div>';
    if(p.motif){
      html += '<div class="xs" style="margin-bottom:6px"><span class="muted">Motif :</span> '+p.motif+'</div>';
    }
    var infosPassage = [];
    if(p.km) infosPassage.push(p.km.toLocaleString('fr-FR')+' km');
    if(p.entree && p.livraison && p.livraison>=p.entree){
      infosPassage.push('Immobilise : '+formaterDelai(joursOuvrablesEntre(p.entree, p.livraison)));
    }
    if(p.nature==='Retour client'){
      infosPassage.push('<span style="color:#A32D2D;font-weight:600">Retour client</span>');
    }
    if(infosPassage.length){
      html += '<div class="xs muted" style="margin-bottom:6px">'+infosPassage.join(' &middot; ')+'</div>';
    }
    if(lignes.length){
      html += '<div class="xs muted" style="margin-bottom:4px">Travaux effectues :</div>';
      html += '<div class="pieces-list">';
      lignes.forEach(function(cl){ html += '<span class="piece-chip">'+cl.piece+(cl.qte>1?' (x'+cl.qte+')':'')+'</span>'; });
      html += '</div>';
    }
    if(!estForfait && lignes.length){
      html += '<div style="margin-top:8px"><button class="btn-detail" onclick="imprimerFacture(\''+p.id+'\')">Imprimer cette facture</button></div>';
    }
    html += '</div>';
  });

  html += '<div style="margin-top:10px;text-align:right;display:flex;gap:8px;justify-content:flex-end">';
  html += '<button class="btn-detail" onclick="exporterHistoriqueExcel(\''+immat+'\')">&#128202; Exporter en Excel</button>';
  html += '<button class="btn-detail" onclick="imprimerHistorique(\''+immat+'\')">&#128424; Imprimer</button>';
  html += '</div>';

  document.getElementById('detailModal').innerHTML = html;
  document.getElementById('detailOverlay').style.display = 'flex';
}

// Ouvre une fenetre d'impression avec l'historique complet d'un vehicule
// (toutes les visites, sans les prix pour un forfait).
// Export Excel de l'historique d'un vehicule : une ligne par piece/
// intervention, avec la visite (date, km, immobilisation, motif) repetee
// sur chaque ligne pour rester exploitable en tri/filtre Excel. Jamais de
// prix pour un vehicule forfait, coherent avec le reste du portail.
// Construit les lignes (tableau de tableaux) pour reproduire la mise en
// page visuelle de l'historique (comme le document imprime) : titre
// vehicule, taux de retour, puis pour chaque visite un mini-tableau
// Piece/Qte avec motif, dates, km au-dessus. Reutilisee par l'export d'un
// seul vehicule et par l'export de toute la flotte.
function construireLignesExcelVehicule(g){
  var estForfait = g.typeClient==='forfait';
  var rows = [];

  rows.push([g.immat+' — '+(g.marque||'')+' '+(g.modele||'')+' ('+g.nbVisites+' visite'+(g.nbVisites>1?'s':'')+')']);
  var tauxRetour = g.nbVisites ? Math.round((g.nbRetours/g.nbVisites)*100) : 0;
  var ligneInfos = 'Taux de retour : '+tauxRetour+'%'+(g.nbRetours>0?' ('+g.nbRetours+'/'+g.nbVisites+')':'');
  if(g.dernierKm) ligneInfos = g.dernierKm.toLocaleString('fr-FR')+' km — '+ligneInfos;
  rows.push([ligneInfos]);
  rows.push([]);

  g.passages.forEach(function(p){
    var dateEntree = p.entree ? new Date(p.entree).toLocaleDateString('fr-FR') : '—';
    var dateSortie = (p.livraison && LIV_ST.indexOf(p.status)>=0) ? new Date(p.livraison).toLocaleDateString('fr-FR') : 'En cours';
    rows.push(['Visite du '+dateEntree+' au '+dateSortie]);
    if(p.motif) rows.push(['Motif : '+p.motif+(p.km?' — '+p.km.toLocaleString('fr-FR')+' km':'')]);
    else if(p.km) rows.push([p.km.toLocaleString('fr-FR')+' km']);

    var lignes = (p.chiffrage && p.chiffrage.lignes) ? p.chiffrage.lignes.filter(function(cl){return (cl.piece||'').trim();}) : [];
    if(lignes.length){
      var entete = estForfait ? ['Piece','Qte'] : ['Piece','Qte','Prix unitaire (FCFA)','Total (FCFA)'];
      rows.push(entete);
      lignes.forEach(function(cl){
        var ligneTab = [cl.piece, cl.qte||1];
        if(!estForfait){
          var pu = parseFloat(cl.prixVente)||0;
          ligneTab.push(pu, pu*(parseInt(cl.qte)||1));
        }
        rows.push(ligneTab);
      });
    } else {
      rows.push(['Aucune intervention enregistree.']);
    }
    rows.push([]);
  });

  rows.push([]);
  return rows;
}

function exporterHistoriqueExcel(immat){
  var g = regrouperParImmatriculation(mesVehicules).find(function(x){return x.immat===immat;});
  if(!g) return;

  var rows = construireLignesExcelVehicule(g);
  var ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:32},{wch:10},{wch:18},{wch:16}];
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, g.immat.substring(0,31));
  XLSX.writeFile(wb, 'Historique_'+g.immat+'.xlsx');
}


function imprimerHistorique(immat){
  var g = regrouperParImmatriculation(mesVehicules).find(function(x){return x.immat===immat;});
  if(!g) return;
  var estForfait = g.typeClient==='forfait';

  var html = '<html><head><meta charset="utf-8"><title>Historique '+g.immat+'</title>';
  html += '<style>body{font-family:Arial,sans-serif;padding:24px;color:#1a1a1a}h1{font-size:18px}h2{font-size:13px;margin-top:18px;border-bottom:1px solid #ccc;padding-bottom:4px}table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}td,th{border:1px solid #ccc;padding:5px 8px;text-align:left}.tot{text-align:right;font-weight:700;margin-top:6px}.resume{margin-top:10px;font-size:12px;color:#444}</style></head><body>';
  html += '<h1>Historique vehicule — '+g.immat+' '+(g.marque||'')+' '+(g.modele||'')+'</h1>';
  html += '<div>Client : '+compteClient.clientNom+(compteClient.departement?' — '+compteClient.departement:'')+'</div>';
  html += '<div>'+g.nbVisites+' visite(s) au total — Edite le '+new Date().toLocaleDateString('fr-FR')+'</div>';

  var tauxRetour = g.nbVisites ? Math.round((g.nbRetours/g.nbVisites)*100) : 0;
  var elementsResume = [];
  if(g.dernierKm) elementsResume.push(g.dernierKm.toLocaleString('fr-FR')+' km');
  if(g.delaiMoyenJours!==null) elementsResume.push('Immobilisation moyenne : '+formaterDelai(g.delaiMoyenJours));
  elementsResume.push('Taux de retour : '+tauxRetour+'%'+(g.nbRetours>0?' ('+g.nbRetours+'/'+g.nbVisites+')':''));
  html += '<div class="resume">'+elementsResume.join(' &middot; ')+'</div>';

  g.passages.forEach(function(p){
    var dateEntree = p.entree ? new Date(p.entree).toLocaleDateString('fr-FR') : '—';
    var dateSortie = (p.livraison && LIV_ST.indexOf(p.status)>=0) ? new Date(p.livraison).toLocaleDateString('fr-FR') : 'En cours';
    var lignes = (p.chiffrage && p.chiffrage.lignes) ? p.chiffrage.lignes.filter(function(cl){return (cl.piece||'').trim();}) : [];
    html += '<h2>Visite du '+dateEntree+' au '+dateSortie+'</h2>';
    if(p.motif) html += '<div>Motif : '+p.motif+'</div>';
    var infosPassage = [];
    if(p.km) infosPassage.push(p.km.toLocaleString('fr-FR')+' km');
    if(p.entree && p.livraison && p.livraison>=p.entree){
      infosPassage.push('Immobilise : '+formaterDelai(joursOuvrablesEntre(p.entree, p.livraison)));
    }
    if(p.nature==='Retour client') infosPassage.push('Retour client');
    if(infosPassage.length) html += '<div>'+infosPassage.join(' — ')+'</div>';
    if(lignes.length){
      html += '<table><thead><tr><th>Piece</th><th>Qte</th>'+(estForfait?'':'<th>Prix</th>')+'</tr></thead><tbody>';
      var total = 0;
      lignes.forEach(function(cl){
        var lt = (parseFloat(cl.prixVente)||0)*(parseInt(cl.qte)||1);
        total += lt;
        html += '<tr><td>'+cl.piece+'</td><td>'+(cl.qte||1)+'</td>'+(estForfait?'':'<td>'+lt.toLocaleString('fr-FR')+' FCFA</td>')+'</tr>';
      });
      html += '</tbody></table>';
      if(!estForfait) html += '<div class="tot">Total visite : '+total.toLocaleString('fr-FR')+' FCFA</div>';
    }
  });

  html += '</body></html>';
  var w = window.open('', '_blank');
  w.document.write(html);
  w.document.close();
  setTimeout(function(){ w.print(); }, 300);
}

// Imprime l'historique complet de TOUS les vehicules actuellement visibles
// (respecte la recherche/periode active), un vehicule par page pour la
// lisibilite. Chaque page suit la meme regle prix/pas-prix que le detail
// individuel (jamais de prix pour un forfait).
// Export Excel de TOUTE la flotte visible (respecte recherche/periode
// actives) dans un seul fichier, un onglet par vehicule pour rester lisible
// (un onglet unique melangeant toutes les immatriculations serait moins
// exploitable pour un client avec une grande flotte).
function exporterToutHistoriqueExcel(){
  var vehiculesFiltres = appliquerFiltres(mesVehicules);
  var groupes = regrouperParImmatriculation(vehiculesFiltres);
  if(!groupes.length){ alert('Aucun vehicule a exporter.'); return; }

  // Tous les vehicules sont concatenes dans une seule feuille (a la suite,
  // separes par une ligne vide), plutot qu'un onglet distinct par vehicule.
  var toutesLesLignes = [];
  groupes.forEach(function(g){
    toutesLesLignes = toutesLesLignes.concat(construireLignesExcelVehicule(g));
  });

  var ws = XLSX.utils.aoa_to_sheet(toutesLesLignes);
  ws['!cols'] = [{wch:32},{wch:10},{wch:18},{wch:16}];
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Historique');

  var nomFichier = 'Historique_'+(compteClient.clientNom||'client').replace(/[^a-zA-Z0-9_-]/g,'_')+'.xlsx';
  XLSX.writeFile(wb, nomFichier);
}

function montantChiffrageLigne(cl){ if(cl.differe) return 0; return (parseFloat(cl.prixVente)||0)*(parseInt(cl.qte)||1)*(1-(parseFloat(cl.remise)||0)/100); }

function estFacturePassage(v){ return STATUTS_FACT_PORTAIL.indexOf(v.status)>=0; }
function nombreEnLettres(n){
  if(!n || n===0) return 'zéro';
  var u=['','un','deux','trois','quatre','cinq','six','sept','huit','neuf',
         'dix','onze','douze','treize','quatorze','quinze','seize',
         'dix-sept','dix-huit','dix-neuf'];
  var d=['','','vingt','trente','quarante','cinquante','soixante','soixante',
         'quatre-vingt','quatre-vingt'];
  function dizaine(n){
    if(n<20) return u[n];
    var d1=Math.floor(n/10),u1=n%10;
    if(d1===7||d1===9){return d[d1]+(u1===0?'':'-'+u[10+u1]);}
    return d[d1]+(u1===0?(d1===8?'s':''):'-'+(u1===1&&d1!==8?'et-':'')+u[u1]);
  }
  function centaine(n){
    var c=Math.floor(n/100),r=n%100;
    if(c===0)return dizaine(r);
    if(c===1)return 'cent'+(r===0?'':' '+dizaine(r));
    return u[c]+' cent'+(r===0?'s':' '+dizaine(r));
  }
  function millier(n){
    if(n===0)return '';
    var m=Math.floor(n/1000),r=n%1000;
    return (m===1?'mille':centaine(m)+' mille')+(r===0?'':' '+centaine(r));
  }
  var mil=Math.floor(n/1000000),r1=n%1000000;
  var sm=mil>0?(mil===1?'un million':centaine(mil)+' millions')+(r1===0?'':' '):'';
  return (sm+(r1>=1000?millier(r1):centaine(r1))||centaine(n)).trim();
}
function blocAcompteDocument(v, totalDocument){
  var versements = (v && v.paiementsClient) || [];
  if(!versements.length) return '';
  var acomptes = versements.filter(function(p){ return p.acompte === true; });
  var autres   = versements.filter(function(p){ return p.acompte !== true; });
  var mAcompte = acomptes.reduce(function(s,p){ return s + (parseFloat(p.montant)||0); }, 0);
  var mAutres  = autres.reduce(function(s,p){ return s + (parseFloat(p.montant)||0); }, 0);
  if(mAcompte <= 0 && mAutres <= 0) return '';
  var net = Math.max(0, totalDocument - mAcompte - mAutres);

  function ligne(libelle, montant, signe){
    return '<tr>'
      + '<td style="padding:5px 10px;font-size:14px;text-align:right">'+libelle+'</td>'
      + '<td style="padding:5px 10px;font-size:14px;text-align:right;font-weight:700;width:130px">'
      + (signe||'') + Math.round(montant).toLocaleString('fr-FR', GOS_FMT0) + ' FCFA</td></tr>';
  }

  var h = '<div style="margin-top:12px;display:flex;justify-content:flex-end">';
  h += '<table style="border-collapse:collapse;min-width:330px">';
  h += ligne('Total', totalDocument);
  if(mAcompte > 0){
    // La date du versement, ou leur nombre s'il y en a eu plusieurs : le
    // client doit pouvoir rapprocher la ligne de son propre recu.
    var precision = acomptes.length === 1
      ? (acomptes[0].date ? ' du ' + new Date(acomptes[0].date).toLocaleDateString('fr-FR') : '')
      : ' (' + acomptes.length + ' versements)';
    h += ligne('Acompte reçu' + precision, mAcompte, '- ');
  }
  if(mAutres > 0){
    h += ligne(autres.length === 1 ? 'Règlement reçu' : 'Règlements reçus (' + autres.length + ')', mAutres, '- ');
  }
  h += '<tr><td colspan="2" style="padding:0"><div style="border-top:2px solid #1a1a1a"></div></td></tr>';
  h += '<tr>'
     + '<td style="padding:7px 10px;font-size:15px;font-weight:700;text-align:right">NET À PAYER</td>'
     + '<td style="padding:7px 10px;font-size:16px;font-weight:900;text-align:right;background:#1a1a1a;color:#fff">'
     + Math.round(net).toLocaleString('fr-FR', GOS_FMT0) + ' FCFA</td></tr>';
  h += '</table></div>';
  return h;
}

function htmlBoutonsTableau(cle, n){
  if(!n) return '';
  var b = function(lib, act, tip){ return '<button class="btn-detail" title="'+tip+'" onclick="exporterTableauDevis(\''+cle+'\',\''+act+'\')">'+lib+'</button>'; };
  return '<span style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;font-weight:400">'
    + b('&#x1F4C4; Tous les devis / factures','docs','Tous les devis ou factures du tableau dans un seul document, une page par vehicule')
    + b('&#x1F5A8; Imprimer / PDF','print','Imprimer le tableau ou l\'enregistrer en PDF')
    + b('&#x1F4CA; Excel','excel','Telecharger le tableau en Excel')
    + b('&#x1F4DD; Word','word','Telecharger le tableau en Word') + '</span>';
}
function nomFichierTableau(t){ return (t.titre.split(' — ')[0]+' '+(compteClient.clientNom||'')).replace(/[^A-Za-z0-9\u00C0-\u017F -]+/g,' ').trim().replace(/\s+/g,'_'); }
function htmlListeTableau(t){
  var h = '<div style="font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;padding:8mm 10mm">';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #1a1a1a;padding-bottom:10px;margin-bottom:14px">'
    + '<img src="'+LOGO_BASE64+'" style="height:55px" alt="Smart Services">'
    + '<div style="text-align:right"><div style="border:3px solid #1a1a1a;padding:6px 14px;font-size:16px;font-weight:900;display:inline-block">'+t.titre.split(' — ')[0].toUpperCase()+'</div>'
    + '<div style="font-size:12px;margin-top:6px">'+(compteClient.clientNom||'')+' — edite le '+new Date().toLocaleDateString('fr-FR')+'</div></div></div>';
  if(t.titre.indexOf(' — ')>0) h += '<div style="font-size:12px;color:#555;margin-bottom:8px">'+t.titre.split(' — ').slice(1).join(' — ')+'</div>';
  h += '<table style="width:100%;border-collapse:collapse;font-size:11px"><thead><tr>';
  t.colonnes.forEach(function(c){ h += '<th style="border:1px solid #999;background:#e8e8e8;padding:5px 6px;text-align:left">'+c+'</th>'; });
  h += '</tr></thead><tbody>';
  t.lignes.forEach(function(l){ h += '<tr>'; l.forEach(function(x){ h += '<td style="border:1px solid #bbb;padding:5px 6px;'+(typeof x==='number'?'text-align:right':'')+'">'+(typeof x==='number'?x.toLocaleString('fr-FR'):(x||''))+'</td>'; }); h += '</tr>'; });
  h += '</tbody></table>';
  h += '<div style="margin-top:10px;text-align:right;font-weight:700;font-size:13px">'+t.totalLibelle+'</div>';
  h += '<div class="pied-smart" style="margin-top:24px;border-top:2px solid #1a1a1a;padding-top:6px;text-align:center;font-size:11px;color:#555">CI -ABJ-2007-A6390 — 2345 ABJ 01 — 27 22 43 63 55 — 07 07 73 90 73</div>';
  return h + '</div>';
}
function afficherDansApercu(titre, html){
  // reutilise la fenetre d'apercu du devis (Imprimer / PDF, Fermer)
  var ov = creerFenetreDocument();
  document.getElementById('docTitre').textContent = titre;
  ov.style.display = 'flex';
  var f = document.getElementById('docFrame'), doc = f.contentDocument || f.contentWindow.document;
  doc.open(); doc.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+titre+'</title><style>@page{size:A4;margin:10mm 10mm 16mm}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body{margin:0}.saut{page-break-after:always;break-after:page}.saut:last-child{page-break-after:auto;break-after:auto}@media print{.pied-smart{position:fixed;bottom:0;left:0;right:0;background:#fff;margin:0!important}}</style></head><body>'+html+'</body></html>'); doc.close();
  setTimeout(function(){ try{ f.style.height = Math.max(doc.body.scrollHeight+20, 600)+'px'; }catch(e){} }, 200);
}
function telecharger(nom, contenu, type){
  var blob = new Blob(['\ufeff', contenu], {type:type}), url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = nom; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function exporterTableauDevis(cle, action){
  var t = DEV_TABLES[cle]; if(!t || !t.lignes.length) return;
  var nom = nomFichierTableau(t);
  if(action==='docs'){
    if(!t.documents.length){ alert('Aucun devis ni facture chiffre dans ce tableau.'); return; }
    var html = t.documents.map(function(p){ return '<div class="saut">'+genererDocumentPassage(p).html+'</div>'; }).join('');
    return afficherDansApercu(t.titre.split(' — ')[0]+' — '+t.documents.length+' document'+(t.documents.length>1?'s':''), html);
  }
  if(action==='print') return afficherDansApercu(t.titre.split(' — ')[0], htmlListeTableau(t));
  if(action==='word'){
    var doc = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"><style>@page{size:A4 landscape;margin:1.5cm}</style></head><body>'+htmlListeTableau(t)+'</body></html>';
    return telecharger(nom+'.doc', doc, 'application/msword');
  }
  if(action==='excel'){
    var rows = [[t.titre], [(compteClient.clientNom||'')+' — edite le '+new Date().toLocaleDateString('fr-FR')], [], t.colonnes].concat(t.lignes);
    var tl = t.colonnes.map(function(){ return ''; }); tl[0] = 'TOTAL'; tl[t.colTotal] = Math.round(t.total||0); rows.push([]); rows.push(tl);
    if(typeof XLSX !== 'undefined'){
      var ws = XLSX.utils.aoa_to_sheet(rows); ws['!cols'] = t.colonnes.map(function(c){ return {wch: Math.max(12, c.length+2)}; });
      var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, t.titre.split(' — ')[0].slice(0,31)); XLSX.writeFile(wb, nom+'.xlsx');
    } else {
      telecharger(nom+'.csv', rows.map(function(r){ return r.map(function(x){ return '"'+String(x==null?'':x).replace(/"/g,'""')+'"'; }).join(';'); }).join('\r\n'), 'text/csv;charset=utf-8');
    }
  }
}
function renderTableauxClientDevis(passages){
  var groupes = regrouperClientDevis(passages);
  var cat = {en_cours:[], differe:[], livre:[], termine:[]};
  groupes.forEach(function(g){ cat[categorieVehicule(g)].push(g); });
  var parEntree = function(a,b){ return (a.courant.entree||0)-(b.courant.entree||0); };
  cat.en_cours.sort(parEntree); cat.differe.sort(parEntree); cat.livre.sort(parEntree);
  var h = '';
  // indicateurs
  var totEnCours = cat.en_cours.reduce(function(s,g){ return s+montantFamille(g.courant,g.dcs); },0);
  var resteTotal = passages.filter(function(p){ return p.status==='facture_deposee'||p.status==='dossier_cloture'; }).reduce(function(s,p){ return s+Math.max(0,totalDevisPassage(p)-(parseFloat(p.montantPaye)||0)); },0);
  h += '<div class="kgrid k4">';
  h += kpiHtml('Vehicules en cours', cat.en_cours.length, '#185FA5');
  h += kpiHtml('Devis differes', cat.differe.length, cat.differe.length?'#854F0B':null);
  h += kpiHtml('Livres — documents attendus', cat.livre.length, cat.livre.length?'#534AB7':null);
  h += kpiHtml('Reste a payer', fmtF(resteTotal)+' FCFA', resteTotal>0?'#A32D2D':'#3B6D11');
  h += '</div>';
  DEV_TABLES = {};
  // 23/11/2026 : chaque tableau dans son propre panneau de couleur
  var panneau = function(c, contenu){ return '<div style="background:'+c.fond+';border:1px solid '+c.bord+';border-left:6px solid '+c.c+';border-radius:12px;padding:2px 14px 14px;margin:22px 0">'+contenu+'</div>'; };
  var C_ENCOURS = {bg:'#D6E7F8', c:'#185FA5', fond:'#EEF5FC', bord:'#BCD6EF'},
      C_DIFF    = {bg:'#F7E3C2', c:'#854F0B', fond:'#FDF6EA', bord:'#EBD3A8'},
      C_LIVRE   = {bg:'#E4E0FA', c:'#534AB7', fond:'#F4F2FD', bord:'#D3CDF3'},
      C_FACT    = {bg:'#F8DADA', c:'#A32D2D', fond:'#FDF1F1', bord:'#EEC4C4'},
      C_HIST    = {bg:'#DCEBC9', c:'#3B6D11', fond:'#F2F8EA', bord:'#CFE2B8'};
  h += panneau(C_ENCOURS, htmlTableauVehiculesDevis('Vehicules en cours', cat.en_cours, C_ENCOURS, 'Aucun vehicule en cours a l\'atelier.', 'en_cours'));
  h += panneau(C_DIFF, htmlTableauVehiculesDevis('Devis differes', cat.differe, C_DIFF, 'Aucun devis differe.', 'differe'));
  h += panneau(C_LIVRE, htmlTableauVehiculesDevis('Vehicules livres — en attente de vos documents (ordre de reparation, bon de commande...)', cat.livre, C_LIVRE, 'Aucun vehicule livre en attente de documents.', 'livre'));
  h += panneau(C_FACT, htmlTableauFacturesAttente(passages));
  if(cat.termine.length){
    cat.termine.sort(function(a,b){ return (b.courant.entree||0)-(a.courant.entree||0); });
    h += panneau(C_HIST, htmlTableauVehiculesDevis('Historique — vehicules factures', cat.termine, C_HIST, '', 'termine'));
  }
  return h;
}

// Imprime une facture individuelle (un seul passage), avec prix — jamais
// utilise pour un vehicule forfait (le bouton n'apparait que pour devis).
function imprimerFacture(passageId){
  var p = mesVehicules.find(function(x){return x.id===passageId;});
  if(!p) return;
  if(p.chiffrage && p.doc){ voirDocument(passageId); return; }   // 23/11/2026 : meme document que le garage
  var lignes = (p.chiffrage && p.chiffrage.lignes) ? p.chiffrage.lignes.filter(function(cl){return (cl.piece||'').trim();}) : [];
  var total = lignes.reduce(function(s,cl){return s+(parseFloat(cl.prixVente)||0)*(parseInt(cl.qte)||1);},0);
  var dateFacture = p.chiffrage.valideDirLe || p.chiffrage.soumisLe || p.entree;

  var html = '<html><head><meta charset="utf-8"><title>Facture '+p.immat+'</title>';
  html += '<style>body{font-family:Arial,sans-serif;padding:24px;color:#1a1a1a}h1{font-size:18px}table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}td,th{border:1px solid #ccc;padding:6px 10px;text-align:left}.tot{text-align:right;font-weight:700;margin-top:10px;font-size:14px}</style></head><body>';
  html += '<h1>Facture — '+(p.immat||'—')+' '+(p.marque||'')+' '+(p.modele||'')+'</h1>';
  html += '<div>Client : '+compteClient.clientNom+'</div>';
  html += '<div>Date : '+(dateFacture?new Date(dateFacture).toLocaleDateString('fr-FR'):'—')+'</div>';
  html += '<table><thead><tr><th>Piece</th><th>Qte</th><th>Prix</th></tr></thead><tbody>';
  lignes.forEach(function(cl){
    var lt = (parseFloat(cl.prixVente)||0)*(parseInt(cl.qte)||1);
    html += '<tr><td>'+cl.piece+'</td><td>'+(cl.qte||1)+'</td><td>'+lt.toLocaleString('fr-FR')+' FCFA</td></tr>';
  });
  html += '</tbody></table>';
  html += '<div class="tot">Total : '+total.toLocaleString('fr-FR')+' FCFA</div>';
  // Versements deja recus et net a payer. Le net se calcule sur le total
  // imprime juste au-dessus, pour que le pied tombe toujours sur ses propres
  // lignes. Rien ne s'affiche si le client n'a rien verse.
  var dejaVerse = Math.round(parseFloat(p.montantPaye)||0);
  if(dejaVerse > 0){
    var netAPayer = Math.max(0, total - dejaVerse);
    html += '<div class="tot" style="font-weight:400">Deja verse : - '+dejaVerse.toLocaleString('fr-FR')+' FCFA</div>';
    html += '<div class="tot" style="border-top:2px solid #1a1a1a;padding-top:6px;margin-top:6px;font-size:15px">'
         + 'NET A PAYER : '+netAPayer.toLocaleString('fr-FR')+' FCFA</div>';
  }
  html += '</body></html>';

  var w = window.open('', '_blank');
  w.document.write(html);
  w.document.close();
  setTimeout(function(){ w.print(); }, 300);
}

// Affiche la liste des vehicules du client dont le controle technique
// arrive a echeance ce mois-ci, dans la meme modale que l'historique d'un
// vehicule (reutilise detailOverlay/detailModal, pas de nouveau composant).
function ouvrirListeCtEcheance(){
  var groupes = regrouperParImmatriculation(mesVehicules);
  var concernes = groupes.filter(function(g){return estEcheanceCeMois(g.ctEcheance);});
  concernes.sort(function(a,b){ return new Date(a.ctEcheance) - new Date(b.ctEcheance); });

  var html = '<button class="detail-close" onclick="fermerDetail()">&#10005;</button>';
  html += '<h3>Controle technique a echeance ou en retard</h3>';
  if(!concernes.length){
    html += '<div class="empty">Aucun vehicule concerne.</div>';
  } else {
    html += '<table><thead><tr><th>Vehicule</th><th>Echeance CT</th><th>Statut</th><th></th></tr></thead><tbody>';
    concernes.forEach(function(g){
      var statut = statutEcheanceCt(g.ctEcheance);
      var badgeStatut = statut==='retard' ? '<span class="badge b-red">En retard</span>' : '<span class="badge b-amber">Ce mois</span>';
      html += '<tr><td>'+g.immat+' <span class="xs muted">'+(g.marque||'')+' '+(g.modele||'')+'</span></td>';
      html += '<td'+(statut==='retard'?' style="color:#A32D2D;font-weight:600"':'')+'>'+new Date(g.ctEcheance).toLocaleDateString('fr-FR')+'</td>';
      html += '<td>'+badgeStatut+'</td>';
      html += '<td><button class="btn-detail" onclick="ouvrirHistoriqueVehicule(\''+g.immat+'\')">Historique</button></td></tr>';
    });
    html += '</tbody></table>';
  }

  document.getElementById('detailModal').innerHTML = html;
  document.getElementById('detailOverlay').style.display = 'flex';
}

function fermerDetail(){
  document.getElementById('detailOverlay').style.display = 'none';
}

// ── Messagerie client <-> garage, liee a un vehicule precis ─────────────
// Stockage : gos_messages/{uid_client}/{vehiculeId}/{messageId}. Separee
// du systeme de commentaires internes du garage (v.commentaires), pour ne
// jamais melanger notes internes et echanges avec le client, et parce que
// les regles Firebase isolent reellement gos_messages par uid (contrairement
// a gos_data, qui reste lisible en entier par tout compte client).
var vehiculeMessagerieActuel = null;
var listenerMessagesActuel = null;

function ouvrirMessagerie(vehiculeId, immat){
  vehiculeMessagerieActuel = vehiculeId;
  document.getElementById('msgTitre').textContent = 'Messages — '+immat;
  document.getElementById('msgListe').innerHTML = '<div class="msg-empty">Chargement...</div>';
  document.getElementById('msgInput').value = '';
  document.getElementById('msgOverlay').style.display = 'flex';

  // Ecoute en temps reel : si le garage repond pendant que la fenetre est
  // ouverte, le message apparait sans que le client ait besoin de rouvrir.
  if(listenerMessagesActuel){
    db.ref('gos_messages/'+currentUid+'/'+listenerMessagesActuel).off();
  }
  var ref = db.ref('gos_messages/'+currentUid+'/'+vehiculeId);
  listenerMessagesActuel = vehiculeId;
  ref.on('value', function(snap){
    renderMessages(snap.val()||{});
    // Marquer les messages du garage comme lus des qu'ils sont affiches
    marquerMessagesLus(vehiculeId, snap.val()||{});
  });
}

function fermerMessagerie(){
  document.getElementById('msgOverlay').style.display = 'none';
  if(listenerMessagesActuel){
    db.ref('gos_messages/'+currentUid+'/'+listenerMessagesActuel).off();
    listenerMessagesActuel = null;
  }
}

function renderMessages(messages){
  var ids = Object.keys(messages).sort(function(a,b){ return (messages[a].date||0)-(messages[b].date||0); });
  if(!ids.length){
    document.getElementById('msgListe').innerHTML = '<div class="msg-empty">Aucun message pour l\'instant. Ecrivez au garage ci-dessous.</div>';
    return;
  }
  var html = '';
  ids.forEach(function(id){
    var m = messages[id];
    var estClient = m.auteur==='client';
    var heure = m.date ? new Date(m.date).toLocaleString('fr-FR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
    html += '<div class="msg-bubble '+(estClient?'msg-client':'msg-garage')+'">';
    html += escapeHtml(m.texte);
    html += '<div class="msg-meta">'+(estClient?'Vous':(m.nomAuteur||'Garage'))+' &middot; '+heure+'</div>';
    html += '</div>';
  });
  document.getElementById('msgListe').innerHTML = html;
  document.getElementById('msgListe').scrollTop = document.getElementById('msgListe').scrollHeight;
}

function escapeHtml(s){
  var d = document.createElement('div');
  d.textContent = s||'';
  return d.innerHTML;
}

function envoyerMessage(){
  var input = document.getElementById('msgInput');
  var texte = input.value.trim();
  if(!texte || !vehiculeMessagerieActuel) return;
  var ref = db.ref('gos_messages/'+currentUid+'/'+vehiculeMessagerieActuel).push();
  ref.set({
    auteur: 'client',
    auteurUid: currentUid,                              // C-09 : auteur verifie par les regles
    nomAuteur: compteClient.nomContact || compteClient.clientNom,
    texte: texte,
    date: firebase.database.ServerValue.TIMESTAMP,      // C-09 : heure du serveur
    lu: false
  });
  input.value = '';
}

function marquerMessagesLus(vehiculeId, messages){
  Object.keys(messages).forEach(function(id){
    var m = messages[id];
    if(m.auteur==='garage' && !m.lu){
      db.ref('gos_messages/'+currentUid+'/'+vehiculeId+'/'+id+'/lu').set(true);
    }
  });
}

// Compteur de messages non lus (reponses du garage), affiche en badge sur
// chaque bouton "Message" au chargement du tableau de bord.
function chargerCompteursMessagesNonLus(){
  if(!currentUid) return;
  db.ref('gos_messages/'+currentUid).once('value').then(function(snap){
    var data = snap.val()||{};
    Object.keys(data).forEach(function(vehiculeId){
      var messages = data[vehiculeId]||{};
      var nbNonLus = Object.keys(messages).filter(function(id){
        return messages[id].auteur==='garage' && !messages[id].lu;
      }).length;
      var btn = document.getElementById('btn-msg-'+vehiculeId);
      if(btn && nbNonLus>0){
        btn.innerHTML = '&#128172; Message <span style="background:#A32D2D;color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;margin-left:3px">'+nbNonLus+'</span>';
      }
    });
  });
}

function deconnexion(){
  auth.signOut().then(function(){
    window.location.href = 'client.html';
  });
}
